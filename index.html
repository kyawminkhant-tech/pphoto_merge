<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side-by-Side Image Combiner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-weight: 700;
      font-size: 1.8rem;
    }
    p.instruction {
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 2rem;
      text-align: center;
    }
    .slots {
      display: flex;
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
      margin-bottom: 2rem;
    }
    .slot {
      flex: 1;
      height: 180px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .slot:hover, .slot.active-target {
      border-color: var(--accent);
      background-color: #243247;
    }
    .slot input[type="file"] {
      display: none;
    }
    .slot span {
      color: #94a3b8;
      font-size: 0.95rem;
      pointer-events: none;
      text-align: center;
      padding: 1rem;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
    }
    .output-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background: #111;
      display: none;
    }
    .actions {
      margin-top: 1rem;
      display: none;
      gap: 1rem;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>Side-by-Side Image Combiner</h1>
  <p class="instruction">
    Press <b>Ctrl+V / ⌘+V</b> to paste your 1st image, then paste your 2nd image.<br/>
    (You can also click any box to select a file manually)
  </p>

  <div class="slots">
    <!-- Slot 1 -->
    <div class="slot" id="slot-0" onclick="triggerFileInput(0)">
      <span id="label-0">Image 1<br>(Paste or Click)</span>
      <input type="file" id="file-0" accept="image/*" onchange="handleFileSelect(event, 0)">
    </div>

    <!-- Slot 2 -->
    <div class="slot" id="slot-1" onclick="triggerFileInput(1)">
      <span id="label-1">Image 2<br>(Paste or Click)</span>
      <input type="file" id="file-1" accept="image/*" onchange="handleFileSelect(event, 1)">
    </div>
  </div>

  <div class="output-container">
    <canvas id="output-canvas"></canvas>
    <div class="actions" id="actions">
      <button onclick="downloadImage()">Download Merged Image</button>
      <button onclick="copyToClipboard()">Copy to Clipboard</button>
      <button style="background: #e2e8f0; color: #334155;" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <script>
    const images = [null, null];
    let nextSlotToFill = 0;

    // Trigger file chooser when clicking on an empty slot
    function triggerFileInput(index) {
      document.getElementById(`file-${index}`).click();
    }

    // Handle manual upload from input
    function handleFileSelect(event, index) {
      const file = event.target.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImageFromFile(file, index);
      }
    }

    // Global Paste Listener (Ctrl+V or Cmd+V)
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || window.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const file = item.getAsFile();
          loadImageFromFile(file, nextSlotToFill);
          
          // Switch destination for next paste: 0 -> 1 -> 0
          nextSlotToFill = (nextSlotToFill + 1) % 2;
          break;
        }
      }
    });

    // Read file as HTML Image
    function loadImageFromFile(file, index) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          images[index] = img;
          renderSlotPreview(index, img.src);
          checkAndCombine();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Show preview inside input slot
    function renderSlotPreview(index, src) {
      const slot = document.getElementById(`slot-${index}`);
      let imgElem = slot.querySelector('img');
      if (!imgElem) {
        imgElem = document.createElement('img');
        slot.appendChild(imgElem);
      }
      imgElem.src = src;
      document.getElementById(`label-${index}`).style.display = 'none';
    }

    // Combine images into the canvas
    function checkAndCombine() {
      if (!images[0] || !images[1]) return;

      const [img1, img2] = images;
      const canvas = document.getElementById('output-canvas');
      const ctx = canvas.getContext('2d');

      // Normalize heights so both images match nicely
      const targetHeight = Math.max(img1.naturalHeight, img2.naturalHeight);

      const scale1 = targetHeight / img1.naturalHeight;
      const scale2 = targetHeight / img2.naturalHeight;

      const width1 = img1.naturalWidth * scale1;
      const width2 = img2.naturalWidth * scale2;

      // Set canvas size
      canvas.width = width1 + width2;
      canvas.height = targetHeight;

      // Draw side-by-side
      ctx.drawImage(img1, 0, 0, width1, targetHeight);
      ctx.drawImage(img2, width1, 0, width2, targetHeight);

      // Reveal canvas and actions
      canvas.style.display = 'block';
      document.getElementById('actions').style.display = 'flex';
      canvas.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Download combined image as PNG
    function downloadImage() {
      const canvas = document.getElementById('output-canvas');
      const link = document.createElement('a');
      link.download = 'side-by-side.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Copy result back to clipboard
    async function copyToClipboard() {
      const canvas = document.getElementById('output-canvas');
      try {
        canvas.toBlob(async (blob) => {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          alert('Merged image copied to clipboard!');
        });
      } catch (err) {
        alert('Could not copy directly to clipboard. You can right-click the image to copy.');
      }
    }

    // Reset everything
    function resetAll() {
      images[0] = null;
      images[1] = null;
      nextSlotToFill = 0;

      [0, 1].forEach((i) => {
        const slot = document.getElementById(`slot-${i}`);
        const img = slot.querySelector('img');
        if (img) img.remove();
        document.getElementById(`label-${i}`).style.display = 'block';
        document.getElementById(`file-${i}`).value = '';
      });

      const canvas = document.getElementById('output-canvas');
      canvas.style.display = 'none';
      document.getElementById('actions').style.display = 'none';
    }
  </script>
</body>
</html>
